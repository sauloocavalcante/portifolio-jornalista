```yaml
backend:
  name: github
  repo: sauloocavalcante/portifolio-jornalista
  branch: main
  site_domain: portifolio-jornalista.netlify.app

media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: "materias"
    label: "Matérias"
    folder: "conteudos/materias"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "URL/Slug", name: "slug", widget: "string", hint: "Ex.: acidente-br-101-sao-miguel" }
      - { label: "Data", name: "data", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Resumo", name: "resumo", widget: "text" }
      - { label: "Link externo", name: "link", widget: "string", required: false, hint: "URL da matéria publicada em outro site" }
      - { label: "Imagem de capa", name: "imagem", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown", required: false }

  - name: "reportagens"
    label: "Reportagens"
    folder: "conteudos/reportagens"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "URL/Slug", name: "slug", widget: "string", hint: "Ex.: moradores-flexais-resistem-apagamento" }
      - { label: "Data", name: "data", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Resumo", name: "resumo", widget: "text" }
      - { label: "Link externo", name: "link", widget: "string", required: false }
      - { label: "Imagem de capa", name: "imagem", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown", required: false }

  - name: "artigos-opiniao"
    label: "Artigos de opinião"
    folder: "conteudos/artigos-opiniao"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "URL/Slug", name: "slug", widget: "string", hint: "Ex.: preciso-inteligencia-artificial" }
      - { label: "Data", name: "data", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Resumo", name: "resumo", widget: "text" }
      - { label: "Link externo", name: "link", widget: "string", required: false }
      - { label: "Imagem de capa", name: "imagem", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown", required: false }

  - name: "resenhas"
    label: "Resenhas"
    folder: "conteudos/resenhas"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "URL/Slug", name: "slug", widget: "string", hint: "Ex.: diabo-veste-prada-2" }
      - { label: "Data", name: "data", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Resumo", name: "resumo", widget: "text" }
      - { label: "Link externo", name: "link", widget: "string", required: false }
      - { label: "Imagem de capa", name: "imagem", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown", required: false }
```
